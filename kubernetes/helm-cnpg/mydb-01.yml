apiVersion: v1
data:
  password: dXNlcg==
  username: dXNlcg==
kind: Secret
metadata:
  name: app-user
type: kubernetes.io/basic-auth
---
apiVersion: v1
data:
  password: c3VwZXJ1c2Vy
  username: c3VwZXJ1c2Vy
kind: Secret
metadata:
  name: superuser
type: kubernetes.io/basic-auth
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: db-cluster 
spec:
  description: "Example of cluster"
  imageName: ghcr.io/cloudnative-pg/postgresql:18.0-system-trixie
  instances: 3
  startDelay: 300
  stopDelay: 300
  primaryUpdateStrategy: unsupervised

  postgresql:
    parameters:
      shared_buffers: 256MB
      pg_stat_statements.max: '10000'
      pg_stat_statements.track: all
      auto_explain.log_min_duration: '10s'

  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: app-user

  enableSuperuserAccess: true
  superuserSecret:
    name: superuser

  storage:
    storageClass: csi-cephfs-sc
    size: 5Gi

  resources:
    requests:
      memory: "512Mi"
      cpu: "1"
    limits:
      memory: "1Gi"
      cpu: "2"

  affinity:
    enablePodAntiAffinity: true
    topologyKey: type
