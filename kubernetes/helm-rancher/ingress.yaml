apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rancher-ing
  namespace: cattle-system
spec:
  ingressClassName: nginx
  rules:
  - host: rancher.hyrsh.io
    http:
      paths:
      - backend:
          service:
            name: rancher
            port:
              number: 80
        path: /
        pathType: Prefix
